<body>

<div class="app-container">

    <!-- HEADER -->

        <div class="app-brand">
            <div class="logo-icon">B</div>
            <h1>Bet<span>Live</span></h1>
        </div>

        <div class="header-actions">

            <div class="user-profile">
                <div class="avatar" id="userAvatar">G</div>
                <span id="userNameDisplay">Guest</span>
            </div>

            <button class="btn btn-danger hidden" id="signOutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>

            </button>

        </div>

    </header>


    <!-- MAIN -->
    <main class="main-content">

        <!-- STATUS -->
        <div class="status-bar">

            <div>
                <span class="status-dot connecting" id="statusDot"></span>
                <span id="statusText">Initializing...</span>
            </div>

            <div>
                Content:
                <strong id="contentCount">0</strong>
            </div>

        </div>


        <!-- AUTH -->
        <div id="authPage" class="auth-page">

            <div class="auth-header">

                    id="authEmail"

                />

                    id="authPassword"

            </button>

                    Don't have an admin account?
                </span>

                <a id="authToggleLink">
                    Create one
                </a>

        <!-- ADMIN CONTENT -->

                <!-- PUBLISH -->
                <div class="publish-area">

                        <input
                            type="text"
                            id="contentTitle"
                            placeholder="Example: Today's Premium Bet"

                        Publish Premium Content

                <!-- CONTENT LIST -->

                    <div class="list-header">

                        <h3>
                            <i class="fa-solid fa-list"></i>
                            Published Content
                        </h3>

                            id="clearAllBtn"

                            <i class="fa-solid fa-trash"></i>

                        </button>

                        id="contentList"
                        class="content-list"

                        <div class="empty-content">
                            No premium content yet.
                        </div>

                </div>

            </div>

        </div>

    </main>

</div>


<script>

    // ============================================================
    // FIREBASE
    // ============================================================

    const firebaseConfig = {

        apiKey: "AIzaSyBEjeRSyKbpEmbNk0SYLUFPp3lbgP9x3Ow",

        authDomain: "volcanobxpl.firebaseapp.com",

        projectId: "volcanobxpl",

        storageBucket: "volcanobxpl.firebasestorage.app",

        messagingSenderId: "742861205377",

        appId: "1:742861205377:web:bbe8a42b78c90354a64280",

        measurementId: "G-G1KWGHLZES"

    };


    firebase.initializeApp(firebaseConfig);


    const auth = firebase.auth();

    const db = firebase.firestore();


    // ============================================================
    // STATE
    // ============================================================

    let currentUser = null;

    let isSignUp = false;

    let unsubscribe = null;


    // ============================================================
    // DOM
    // ============================================================

    const $ = id => document.getElementById(id);


    const authPage = $("authPage");

    const adminContent = $("adminContent");

    const authEmail = $("authEmail");

    const authPassword = $("authPassword");

    const authSubmitBtn = $("authSubmitBtn");

    const authToggleLink = $("authToggleLink");

    const authToggleText = $("authToggleText");

    const authTitle = $("authTitle");

    const authSubtitle = $("authSubtitle");

    const authError = $("authError");

    const signOutBtn = $("signOutBtn");

    const userAvatar = $("userAvatar");

    const userNameDisplay = $("userNameDisplay");

    const statusDot = $("statusDot");

    const statusText = $("statusText");

    const contentCount = $("contentCount");

    const contentTitle = $("contentTitle");

    const contentText = $("contentText");

    const contentPrice = $("contentPrice");

    const contentActive = $("contentActive");

    const publishBtn = $("publishBtn");

    const clearAllBtn = $("clearAllBtn");

    const contentList = $("contentList");


    // ============================================================
    // FIRESTORE COLLECTION
    // ============================================================

    const premiumContentRef =
        db.collection("premiumContent");


    // ============================================================
    // AUTH MODE
    // ============================================================

    function toggleAuthMode(signUp = false) {

        isSignUp = signUp;

        authError.classList.add("hidden");

        authError.textContent = "";

        authEmail.value = "";

        authPassword.value = "";


        if (signUp) {

            authTitle.textContent =
                "Create Admin Account";

            authSubtitle.textContent =
                "Register as an administrator";

            authSubmitBtn.innerHTML =
                '<i class="fa-solid fa-user-plus"></i> Register as Admin';

            authToggleText.textContent =
                "Already have an account?";

            authToggleLink.textContent =
                "Sign In";

        } else {

            authTitle.textContent =
                "Admin Sign In";

            authSubtitle.textContent =
                "Sign in to manage premium content";

            authSubmitBtn.innerHTML =
                '<i class="fa-solid fa-right-to-bracket"></i> Sign In';

            authToggleText.textContent =
                "Don't have an admin account?";

            authToggleLink.textContent =
                "Create one";
        }

    }


    // ============================================================
    // AUTH ERROR
    // ============================================================

    function showAuthError(message) {

        authError.textContent = message;

        authError.classList.remove("hidden");

    }


    // ============================================================
    // AUTH SUBMIT
    // ============================================================

    async function handleAuthSubmit() {

        const email =
            authEmail.value.trim();

        const password =
            authPassword.value.trim();


        if (!email || !password) {

            showAuthError(
                "Please fill in all fields."
            );

            return;
        }


        if (password.length < 6) {

            showAuthError(
                "Password must be at least 6 characters."
            );

            return;
        }


        authSubmitBtn.disabled = true;


        try {

            if (isSignUp) {

                const result =
                    await auth.createUserWithEmailAndPassword(
                        email,
                        password
                    );


                const user =
                    result.user;


                await db
                    .collection("users")
                    .doc(user.uid)
                    .set({

                        email: user.email,

                        role: "admin",

                        createdAt:
                            firebase.firestore.FieldValue.serverTimestamp()

                    });


                showToast(
                    "Admin account created.",
                    "success"
                );

            } else {

                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );


                showToast(
                    "Signed in successfully.",
                    "success"
                );

            }

        } catch (error) {

            console.error(error);

            showAuthError(
                error.message
            );

        } finally {

            authSubmitBtn.disabled = false;

            toggleAuthMode(isSignUp);

        }

    }


    // ============================================================
    // USER UI
    // ============================================================

    async function updateUI(user) {

        if (!user) {

            currentUser = null;

            userAvatar.textContent = "G";

            userNameDisplay.textContent = "Guest";

            signOutBtn.classList.add("hidden");

            authPage.classList.remove("hidden");

            adminContent.classList.add("hidden");

            updateStatus(
                "offline",
                "Not signed in"
            );

            if (unsubscribe) {

                unsubscribe();

                unsubscribe = null;

            }

            return;
        }


        currentUser = user;

        userAvatar.textContent =
            (user.email || "A")
                .charAt(0)
                .toUpperCase();

        userNameDisplay.textContent =
            user.email || "Admin";

        signOutBtn.classList.remove(
            "hidden"
        );


        try {

            const userDoc =
                await db
                    .collection("users")
                    .doc(user.uid)
                    .get();


            if (
                !userDoc.exists ||
                userDoc.data().role !== "admin"
            ) {

                authPage.classList.remove(
                    "hidden"
                );

                adminContent.classList.add(
                    "hidden"
                );

                showAuthError(
                    "Access denied. This account is not an admin."
                );

                updateStatus(
                    "offline",
                    "Access denied"
                );

                return;
            }


            authPage.classList.add("hidden");

            adminContent.classList.remove(
                "hidden"
            );

            startListening();


        } catch (error) {

            console.error(error);

            showAuthError(
                "Unable to verify admin account."
            );

        }

    }


    // ============================================================
    // STATUS
    // ============================================================

    function updateStatus(state, text) {

        statusDot.className =
            "status-dot " + state;

        statusText.textContent =
            text;

    }


    // ============================================================
    // LISTEN FOR CONTENT
    // ============================================================

    function startListening() {

        if (unsubscribe) {

            unsubscribe();

        }


        updateStatus(
            "connecting",
            "Loading content..."
        );


        unsubscribe =
            premiumContentRef
                .orderBy("timestamp", "desc")
                .onSnapshot(

                    snapshot => {

                        updateStatus(
                            "online",
                            "Live"
                        );


                        contentCount.textContent =
                            snapshot.size;


                        if (snapshot.empty) {

                            contentList.innerHTML =
                                `
                                <div class="empty-content">
                                    No premium content yet.
                                </div>
                                `;

                            return;
                        }


                        let html = "";


                        snapshot.forEach(doc => {

                            const data =
                                doc.data();


                            const title =
                                data.title ||
                                "Untitled";


                            const text =
                                data.text ||
                                "";


                            const price =
                                Number(
                                    data.price || 0
                                );


                            const active =
                                data.active !== false;


                            const time =
                                data.timestamp
                                    ? data.timestamp.toDate()
                                    : new Date();


                            const date =
                                time.toLocaleDateString(
                                    [],
                                    {
                                        month: "short",
                                        day: "numeric"
                                    }
                                );


                            const timeString =
                                time.toLocaleTimeString(
                                    [],
                                    {
                                        hour: "2-digit",
                                        minute: "2-digit"
                                    }
                                );


                            html += `

                                <div
                                    class="content-card"
                                    data-id="${doc.id}"
                                >

                                    <div class="content-card-header">

                                        <div style="flex:1;">

                                            <div class="content-title">
                                                ${escapeHtml(title)}
                                            </div>

                                            <div class="content-preview">
                                                ${escapeHtml(text)}
                                            </div>

                                            <div class="content-price">
                                                TZS ${price.toLocaleString()}
                                            </div>

                                            <div class="content-meta">

                                                ${active ? "🟢 Active" : "🔴 Inactive"}
                                                ·
                                                ${date} ${timeString}

                                            </div>

                                        </div>


                                        <div class="content-actions">

                                            <button
                                                class="btn btn-danger btn-sm delete-content"
                                                data-id="${doc.id}"
                                            >

                                                <i class="fa-solid fa-trash"></i>

                                                Delete

                                            </button>

                                        </div>

                                    </div>

                                </div>

                            `;

                        });


                        contentList.innerHTML =
                            html;


                        document
                            .querySelectorAll(
                                ".delete-content"
                            )
                            .forEach(button => {

                                button.addEventListener(
                                    "click",
                                    () => {

                                        deleteContent(
                                            button.dataset.id
                                        );

                                    }
                                );

                            });

                    },

                    error => {

                        console.error(error);

                        updateStatus(
                            "offline",
                            "Database error"
                        );

                        contentList.innerHTML =
                            `
                            <div class="empty-content">
                                Unable to load content.
                            </div>
                            `;

                    }
                );

    }


    // ============================================================
    // PUBLISH CONTENT
    // ============================================================

    async function publishContent() {

        const title =
            contentTitle.value.trim();

        const text =
            contentText.value.trim();

        const price =
            Number(contentPrice.value);

        const active =
            contentActive.value === "true";


        if (!title) {

            showToast(
                "Please enter a title.",
                "info"
            );

            return;
        }


        if (!text) {

            showToast(
                "Please enter the premium content.",
                "info"
            );

            return;
        }


        if (
            !Number.isFinite(price) ||
            price <= 0
        ) {

            showToast(
                "Please enter a valid price.",
                "info"
            );

            return;
        }


        publishBtn.disabled = true;

        publishBtn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Publishing...';


        try {

            await premiumContentRef.add({

                title: title,

                text: text,

                price: price,

                currency: "TZS",

                active: active,

                from:
                    currentUser?.email ||
                    "admin",

                timestamp:
                    firebase.firestore.FieldValue
                        .serverTimestamp()

            });


            contentTitle.value = "";

            contentText.value = "";

            contentPrice.value = "";

            contentActive.value = "true";


            showToast(
                "Premium content published!",
                "success"
            );


        } catch (error) {

            console.error(
                "Publish error:",
                error
            );

            showToast(
                "Failed to publish: " +
                error.message,
                "error"
            );

        } finally {

            publishBtn.disabled = false;

            publishBtn.innerHTML =
                '<i class="fa-solid fa-paper-plane"></i> Publish Premium Content';

        }

    }


    // ============================================================
    // DELETE
    // ============================================================

    async function deleteContent(id) {

        if (
            !confirm(
                "Delete this premium content?"
            )
        ) {

            return;

        }


        try {

            await premiumContentRef
                .doc(id)
                .delete();


            showToast(
                "Content deleted.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showToast(
                "Delete failed: " +
                error.message,
                "error"
            );

        }

    }


    // ============================================================
    // CLEAR ALL
    // ============================================================

    async function clearAllContent() {

        if (
            !confirm(
                "DELETE ALL PREMIUM CONTENT?\n\nThis cannot be undone."
            )
        ) {

            return;

        }


        try {

            const snapshot =
                await premiumContentRef.get();


            if (snapshot.empty) {

                showToast(
                    "No content to delete.",
                    "info"
                );

                return;
            }


            const batch =
                db.batch();


            snapshot.forEach(doc => {

                batch.delete(doc.ref);

            });


            await batch.commit();


            showToast(
                "All content deleted.",
                "success"
            );


        } catch (error) {

            console.error(error);

            showToast(
                "Failed: " +
                error.message,
                "error"
            );

        }

    }


    // ============================================================
    // SIGN OUT
    // ============================================================

    async function signOut() {

        await auth.signOut();

        showToast(
            "Signed out.",
            "info"
        );

    }


    // ============================================================
    // ESCAPE HTML
    // ============================================================

    function escapeHtml(value) {

        if (!value) return "";

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ============================================================
    // TOAST
    // ============================================================

    function showToast(
        message,
        type = "info"
    ) {

        const old =
            document.querySelector(
                ".toast"
            );


        if (old) old.remove();


        const toast =
            document.createElement(
                "div"
            );


        toast.className =
            `toast ${type}`;


        toast.textContent =
            message;


        document.body.appendChild(
            toast
        );


        setTimeout(() => {

            toast.remove();

        }, 3500);

    }


    // ============================================================
    // EVENTS
    // ============================================================

    authSubmitBtn.addEventListener(
        "click",
        handleAuthSubmit
    );


    authPassword.addEventListener(

            ) {

            }

        }
    );


    authEmail.addEventListener(

            ) {

            }

        }
    );


    authToggleLink.addEventListener(

                !isSignUp
            );

        }
    );


    signOutBtn.addEventListener(

    );


    publishBtn.addEventListener(

    );


    clearAllBtn.addEventListener(

    );

    // ============================================================

    auth.onAuthStateChanged(

            updateUI(user);

        }
    );

    // ============================================================

    toggleAuthMode(false);

    updateStatus(
        "connecting",
        "Initializing..."
    );


    console.log(
        "🚀 BetLive Premium Admin ready"
    );

    console.log(
        "📌 Firestore collection: premiumContent"
    );

</script>
