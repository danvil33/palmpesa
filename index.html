<script>

    /* ============================================================
       FIREBASE
    ============================================================ */

    const firebaseConfig = {

        apiKey:
            "AIzaSyBEjeRSyKbpEmbNk0SYLUFPp3lbgP9x3Ow",

        authDomain:
            "volcanobxpl.firebaseapp.com",

        projectId:
            "volcanobxpl",

        storageBucket:
            "volcanobxpl.firebasestorage.app",

        messagingSenderId:
            "742861205377",

        appId:
            "1:742861205377:web:bbe8a42b78c90354a64280",

        measurementId:
            "G-G1KWGHLZES"

    };


    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const db = firebase.firestore();


    /* ============================================================
       STATE
    ============================================================ */

    let currentUser = null;

    let signUpMode = false;

    let selectedContent = null;

    let unsubscribeContent = null;


    /* ============================================================
       DOM
    ============================================================ */

    const authScreen =
        document.getElementById("authScreen");

    const main =
        document.getElementById("main");

    const header =
        document.getElementById("header");

    const authTitle =
        document.getElementById("authTitle");

    const authSubtitle =
        document.getElementById("authSubtitle");

    const authButton =
        document.getElementById("authButton");

    const switchText =
        document.getElementById("switchText");

    const switchButton =
        document.getElementById("switchButton");

    const authMessage =
        document.getElementById("authMessage");

    const contentList =
        document.getElementById("contentList");

    const userEmail =
        document.getElementById("userEmail");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const paymentModal =
        document.getElementById("paymentModal");

    const paymentTitle =
        document.getElementById("paymentTitle");

    const paymentAmount =
        document.getElementById("paymentAmount");

    const paymentPhone =
        document.getElementById("paymentPhone");

    const paymentButton =
        document.getElementById("paymentButton");

    const paymentMessage =
        document.getElementById("paymentMessage");

    const cancelPayment =
        document.getElementById("cancelPayment");


    /* ============================================================
       AUTH MODE
    ============================================================ */

    switchButton.addEventListener(
        "click",
        () => {

            signUpMode = !signUpMode;

            clearMessage(authMessage);

            if (signUpMode) {

                authTitle.textContent =
                    "Create your account";

                authSubtitle.textContent =
                    "Create a bettor account to access premium content.";

                authButton.textContent =
                    "Create account";

                switchText.textContent =
                    "Already have an account?";

                switchButton.textContent =
                    "Sign in";

            } else {

                authTitle.textContent =
                    "Welcome to BetLive";

                authSubtitle.textContent =
                    "Sign in to access premium betting content.";

                authButton.textContent =
                    "Sign in";

                switchText.textContent =
                    "Don't have an account?";

                switchButton.textContent =
                    "Create account";

            }

        }
    );


    /* ============================================================
       AUTH
    ============================================================ */

    authButton.addEventListener(
        "click",
        handleAuth
    );


    async function handleAuth() {

        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;


        clearMessage(authMessage);


        if (!email || !password) {

            showMessage(
                authMessage,
                "Enter your email and password.",
                "error"
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                authMessage,
                "Password must contain at least 6 characters.",
                "error"
            );

            return;

        }


        authButton.disabled = true;

        authButton.textContent =
            "Please wait...";


        try {

            if (signUpMode) {

                const result =
                    await auth
                        .createUserWithEmailAndPassword(
                            email,
                            password
                        );


                await db
                    .collection("users")
                    .doc(result.user.uid)
                    .set({

                        email:
                            email,

                        role:
                            "bettor",

                        createdAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()

                    });

            } else {

                await auth
                    .signInWithEmailAndPassword(
                        email,
                        password
                    );

            }

        } catch (error) {

            console.error(
                "Authentication error:",
                error
            );

            showMessage(
                authMessage,
                friendlyAuthError(error),
                "error"
            );

        } finally {

            authButton.disabled = false;

            authButton.textContent =
                signUpMode
                    ? "Create account"
                    : "Sign in";

        }

    }


    function friendlyAuthError(error) {

        const messages = {

            "auth/email-already-in-use":
                "That email is already registered.",

            "auth/invalid-email":
                "Please enter a valid email address.",

            "auth/user-not-found":
                "No account was found with this email.",

            "auth/wrong-password":
                "Incorrect email or password.",

            "auth/invalid-credential":
                "Incorrect email or password.",

            "auth/weak-password":
                "Password must contain at least 6 characters."

        };


        return messages[error.code] ||
            error.message ||
            "Authentication failed.";

    }


    /* ============================================================
       LOGOUT
    ============================================================ */

    logoutBtn.addEventListener(
        "click",
        async () => {

            await auth.signOut();

        }
    );


    /* ============================================================
       AUTH STATE
    ============================================================ */

    auth.onAuthStateChanged(
        async user => {

            if (!user) {

                currentUser = null;

                authScreen.classList.remove(
                    "hidden"
                );

                main.classList.add(
                    "hidden"
                );

                header.classList.add(
                    "hidden"
                );

                return;

            }


            currentUser = user;

            userEmail.textContent =
                user.email;


            authScreen.classList.add(
                "hidden"
            );

            main.classList.remove(
                "hidden"
            );

            header.classList.remove(
                "hidden"
            );


            await ensureUserDocument();

            loadContent();

        }
    );


    /* ============================================================
       USER DOCUMENT
    ============================================================ */

    async function ensureUserDocument() {

        const ref =
            db
                .collection("users")
                .doc(currentUser.uid);


        const snapshot =
            await ref.get();


        if (!snapshot.exists) {

            await ref.set({

                email:
                    currentUser.email,

                role:
                    "bettor",

                createdAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });

        }

    }


    /* ============================================================
       LOAD CONTENT
    ============================================================ */

    function loadContent() {

        if (unsubscribeContent) {

            unsubscribeContent();

        }


        unsubscribeContent =
            db
                .collection("content")
                .orderBy(
                    "createdAt",
                    "desc"
                )
                .onSnapshot(

                    snapshot => {

                        if (snapshot.empty) {

                            contentList.innerHTML = `
                                <div class="empty">
                                    No premium content available yet.
                                </div>
                            `;

                            return;

                        }


                        let html = "";


                        snapshot.forEach(
                            doc => {

                                const data =
                                    doc.data();


                                html +=
                                    createContentCard(
                                        doc.id,
                                        data
                                    );

                            }
                        );


                        contentList.innerHTML =
                            html;

                    },

                    error => {

                        console.error(
                            "Content error:",
                            error
                        );

                        contentList.innerHTML = `
                            <div class="empty">
                                Unable to load content.
                            </div>
                        `;

                    }

                );

    }


    /* ============================================================
       CONTENT CARD
    ============================================================ */

    function createContentCard(
        id,
        data
    ) {

        const title =
            escapeHtml(
                data.title ||
                "Premium Content"
            );


        const description =
            escapeHtml(
                data.description ||
                "Exclusive BetLive premium content."
            );


        const amount =
            Number(data.price || 0);


        const content =
            escapeHtml(
                data.content ||
                ""
            );


        if (amount <= 0) {

            return `

                <article class="content-card">

                    <div class="content-main">

                        <div class="content-top">

                            <h2 class="content-title">
                                ${title}
                            </h2>

                            <div class="price">
                                FREE
                            </div>

                        </div>

                        <div class="description">
                            ${description}
                        </div>

                        <div class="free-content">

                            <div class="available">
                                Available
                            </div>

                            <div class="premium-text">
                                ${content}
                            </div>

                        </div>

                    </div>

                </article>

            `;

        }


        return `

            <article class="content-card">

                <div class="content-main">

                    <div class="content-top">

                        <h2 class="content-title">
                            ${title}
                        </h2>

                        <div class="price">
                            ${formatMoney(amount)} TZS
                        </div>

                    </div>

                    <div class="description">
                        ${description}
                    </div>

                    <div class="locked">

                        <div class="locked-header">

                            <div class="lock">
                                🔒
                            </div>

                            <div class="locked-title">
                                Premium content locked
                            </div>

                        </div>

                        <div class="locked-text">
                            Make a mobile payment to unlock this premium content.
                        </div>

                        <button
                            class="pay-btn"
                            onclick="openPayment(
                                '${id}',
                                ${amount},
                                '${escapeAttribute(title)}'
                            )"
                        >
                            Unlock for ${formatMoney(amount)} TZS
                        </button>

                    </div>

                </div>

            </article>

        `;

    }


    /* ============================================================
       PAYMENT MODAL
    ============================================================ */

    function openPayment(
        contentId,
        amount,
        title
    ) {

        selectedContent = {

            id:
                contentId,

            amount:
                amount,

            title:
                title

        };


        paymentTitle.textContent =
            title;


        paymentAmount.textContent =
            formatMoney(amount) +
            " TZS";


        paymentPhone.value =
            "";


        clearMessage(
            paymentMessage
        );


        paymentButton.disabled =
            false;

        paymentButton.textContent =
            "Pay now";


        paymentModal.classList.remove(
            "hidden"
        );

    }


    window.openPayment =
        openPayment;


    function closePayment() {

        paymentModal.classList.add(
            "hidden"
        );

        selectedContent =
            null;

    }


    cancelPayment.addEventListener(
        "click",
        closePayment
    );


    paymentModal.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                paymentModal
            ) {

                closePayment();

            }

        }
    );


    /* ============================================================
       START PAYMENT
       
       IMPORTANT:
       This sends ONLY the fields required by the
       proven PalmPesa endpoint:
       
       name
       email
       phone
       amount
       
       The backend creates transaction_id.
    ============================================================ */

    paymentButton.addEventListener(
        "click",
        startPayment
    );


    async function startPayment() {

        if (!currentUser) {

            showMessage(
                paymentMessage,
                "Please sign in first.",
                "error"
            );

            return;

        }


        if (!selectedContent) {

            showMessage(
                paymentMessage,
                "No content selected.",
                "error"
            );

            return;

        }


        const phone =
            paymentPhone.value
                .trim()
                .replace(/\s+/g, "");


        if (!phone) {

            showMessage(
                paymentMessage,
                "Enter your Tanzanian phone number.",
                "error"
            );

            return;

        }


        /*
         * Accept:
         *
         * 07XXXXXXXX
         * 06XXXXXXXX
         * 2557XXXXXXXX
         * 2556XXXXXXXX
         */

        let cleanPhone =
            phone;


        if (
            cleanPhone.startsWith("0")
        ) {

            cleanPhone =
                "255" +
                cleanPhone.substring(1);

        }


        if (
            !/^255(6|7)\d{8}$/.test(
                cleanPhone
            )
        ) {

            showMessage(
                paymentMessage,
                "Enter a valid Tanzanian mobile number.",
                "error"
            );

            return;

        }


        const amount =
            Number(
                selectedContent.amount
            );


        if (
            !Number.isFinite(amount) ||
            amount <= 0
        ) {

            showMessage(
                paymentMessage,
                "Invalid payment amount.",
                "error"
            );

            return;

        }


        paymentButton.disabled =
            true;

        paymentButton.textContent =
            "Sending request...";


        clearMessage(
            paymentMessage
        );


        /*
         * THIS IS THE IMPORTANT PART.
         *
         * Do NOT send transaction_id.
         * Do NOT send contentId.
         * Do NOT send buyer_uuid.
         * Do NOT send user_id.
         *
         * Your proven backend creates transaction_id itself.
         */

        const paymentData = {

            name:
                currentUser.email,

            email:
                currentUser.email,

            phone:
                cleanPhone,

            amount:
                amount

        };


        console.log(
            "Sending payment:",
            paymentData
        );


        try {

            const response =
                await fetch(
                    "/api/payment",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                paymentData
                            )

                    }
                );


            const raw =
                await response.text();


            console.log(
                "Payment HTTP status:",
                response.status
            );

            console.log(
                "Payment raw response:",
                raw
            );


            let result;

            try {

                result =
                    JSON.parse(raw);

            } catch {

                result = {

                    success:
                        false,

                    message:
                        raw ||
                        "Payment server returned an invalid response."

                };

            }


            console.log(
                "Payment response:",
                result
            );


            if (
                !response.ok ||
                result.success !== true
            ) {

                /*
                 * Show the REAL backend/PalmPesa
                 * error instead of hiding it.
                 */

                let errorMessage =
                    result.message ||
                    result.error ||
                    result.data?.message ||
                    result.data?.error ||
                    result.data?.raw_response ||
                    "Payment failed.";

                throw new Error(
                    errorMessage
                );

            }


            showMessage(
                paymentMessage,
                "Payment request sent. Check your phone and approve the payment.",
                "success"
            );


            paymentButton.textContent =
                "Payment request sent";


            /*
             * We intentionally do not unlock content
             * merely because PalmPesa accepted the
             * payment request.
             *
             * Final unlocking should happen after
             * confirmed payment.
             */

        } catch (error) {

            console.error(
                "Payment error:",
                error
            );


            showMessage(
                paymentMessage,
                error.message ||
                "Unable to start payment.",
                "error"
            );


            paymentButton.disabled =
                false;

            paymentButton.textContent =
                "Pay now";

        }

    }


    /* ============================================================
       HELPERS
    ============================================================ */

    function formatMoney(number) {

        return Number(number)
            .toLocaleString("en-TZ");

    }


    function showMessage(
        element,
        text,
        type
    ) {

        element.textContent =
            text;

        element.className =
            "message show " +
            type;

    }


    function clearMessage(element) {

        element.textContent =
            "";

        element.className =
            "message";

    }


    function escapeHtml(value) {

        return String(
            value || ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function escapeAttribute(value) {

        return String(
            value || ""
        )
            .replace(
                /\\/g,
                "\\\\"
            )
            .replace(
                /'/g,
                "\\'"
            )
            .replace(
                /\n/g,
                "\\n"
            )
            .replace(
                /\r/g,
                ""
            );

    }


    /* ============================================================
       ENTER KEY
    ============================================================ */

    document
        .getElementById("password")
        .addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    handleAuth();

                }

            }
        );


    /* ============================================================
       INITIAL
    ============================================================ */

    console.log(
        "BetLive bettor application initialized."
    );

</script>
