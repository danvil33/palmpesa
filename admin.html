<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin · BetLive</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, sans-serif;
            background: #0b0e11;
            color: #eaecef;
            min-height: 100vh;
            padding: 20px;
        }

        .app {
            max-width: 900px;
            margin: auto;
        }

        header {
            background: #181a20;
            border: 1px solid #2b3139;
            border-radius: 18px;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #f0b90b;
            color: #181a20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }

        .brand h1 {
            color: #f0b90b;
            font-size: 20px;
        }

        .brand span {
            color: #eaecef;
            font-weight: 400;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f0b90b;
            color: #181a20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 9px;
            font-weight: 600;
        }

        .primary {
            background: #f0b90b;
            color: #181a20;
        }

        .danger {
            background: #f6465d;
            color: white;
        }

        .success {
            background: #0ecb81;
            color: white;
        }

        .panel {
            background: #181a20;
            border: 1px solid #2b3139;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 18px;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #848e9c;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            background: #0b0e11;
            color: #eaecef;
            border: 1px solid #2b3139;
            border-radius: 10px;
            padding: 12px 14px;
            font-family: inherit;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #f0b90b;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .price-row {
            display: flex;
            gap: 10px;
        }

        .price-row input {
            flex: 1;
        }

        .currency {
            background: #2b3139;
            padding: 12px 15px;
            border-radius: 10px;
            font-weight: 600;
            color: #f0b90b;
        }

        .auth {
            max-width: 420px;
            margin: 70px auto;
        }

        .auth h2 {
            text-align: center;
            color: #f0b90b;
            margin-bottom: 8px;
        }

        .auth p {
            text-align: center;
            color: #848e9c;
            margin-bottom: 25px;
        }

        .auth .btn {
            width: 100%;
        }

        .error {
            background: rgba(246,70,93,.1);
            color: #f6465d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }

        .content-card {
            background: #0b0e11;
            border: 1px solid #2b3139;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
        }

        .content-title {
            font-weight: 700;
            font-size: 15px;
        }

        .price {
            color: #0ecb81;
            font-weight: 700;
            white-space: nowrap;
        }

        .content-preview {
            color: #848e9c;
            margin-top: 8px;
            line-height: 1.5;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .content-footer {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .date {
            color: #5e6673;
            font-size: 11px;
        }

        .empty {
            text-align: center;
            color: #848e9c;
            padding: 35px;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2329;
            border: 1px solid #2b3139;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 9999;
        }

        @media(max-width:600px) {
            body {
                padding: 10px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
            }

            .price-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header id="header">

        <div class="brand">
            <div class="logo">B</div>
            <h1>Bet<span>Live Admin</span></h1>
        </div>

        <div class="user hidden" id="userArea">
            <div class="avatar" id="avatar">A</div>

            <span id="userEmail"></span>

            <button
                class="btn danger"
                id="logoutBtn"
            >
                Logout
            </button>
        </div>

    </header>


    <!-- LOGIN -->
    <div class="panel auth" id="loginPanel">

        <h2>Admin Login</h2>

        <p>Sign in to manage premium content</p>

        <div
            class="error hidden"
            id="loginError"
        ></div>

        <div class="field">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="admin@email.com"
            >

        </div>

        <div class="field">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

        </div>

        <button
            class="btn primary"
            id="loginBtn"
        >
            <i class="fa-solid fa-right-to-bracket"></i>
            Sign In
        </button>

    </div>


    <!-- ADMIN DASHBOARD -->
    <div
        id="dashboard"
        class="hidden"
    >

        <!-- CREATE CONTENT -->
        <div class="panel">

            <h2>
                <i class="fa-solid fa-plus"></i>
                Publish Premium Content
            </h2>

            <div class="field">

                <label>Content Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Example: Today's VIP Bet"
                >

            </div>


            <div class="field">

                <label>Premium Content</label>

                <textarea
                    id="content"
                    placeholder="Write the content that customers will unlock after payment..."
                ></textarea>

            </div>


            <div class="field">

                <label>Price</label>

                <div class="price-row">

                    <input
                        type="number"
                        id="price"
                        min="1"
                        placeholder="500"
                    >

                    <div class="currency">
                        TZS
                    </div>

                </div>

            </div>


            <button
                class="btn success"
                id="publishBtn"
            >
                <i class="fa-solid fa-paper-plane"></i>
                Publish Content
            </button>

        </div>


        <!-- CONTENT LIST -->
        <div class="panel">

            <h2>
                <i class="fa-solid fa-list"></i>
                Published Content
            </h2>

            <div id="contentList">

                <div class="empty">
                    Loading content...
                </div>

            </div>

        </div>

    </div>

</div>


<script>

    // ============================================================
    // FIREBASE
    // ============================================================

    const firebaseConfig = {

        apiKey: "AIzaSyBEjeRSyKbpEmbNk0SYLUFPp3lbgP9x3Ow",

        authDomain: "volcanobxpl.firebaseapp.com",

        projectId: "volcanobxpl",

        storageBucket: "volcanobxpl.firebasestorage.app",

        messagingSenderId: "742861205377",

        appId: "1:742861205377:web:bbe8a42b78c90354a64280",

        measurementId: "G-G1KWGHLZES"

    };


    firebase.initializeApp(firebaseConfig);


    const auth = firebase.auth();

    const db = firebase.firestore();


    // ============================================================
    // DOM
    // ============================================================

    const loginPanel =
        document.getElementById("loginPanel");

    const dashboard =
        document.getElementById("dashboard");

    const loginBtn =
        document.getElementById("loginBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const loginError =
        document.getElementById("loginError");

    const userArea =
        document.getElementById("userArea");

    const userEmail =
        document.getElementById("userEmail");

    const avatar =
        document.getElementById("avatar");

    const titleInput =
        document.getElementById("title");

    const contentInput =
        document.getElementById("content");

    const priceInput =
        document.getElementById("price");

    const publishBtn =
        document.getElementById("publishBtn");

    const contentList =
        document.getElementById("contentList");


    // ============================================================
    // AUTH
    // ============================================================

    loginBtn.addEventListener(
        "click",
        async () => {

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;

            loginError.classList.add("hidden");

            if (!email || !password) {

                loginError.textContent =
                    "Enter email and password.";

                loginError.classList.remove("hidden");

                return;
            }

            loginBtn.disabled = true;

            loginBtn.textContent = "Signing in...";

            try {

                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );

            } catch (error) {

                console.error(error);

                loginError.textContent =
                    error.message;

                loginError.classList.remove(
                    "hidden"
                );

            } finally {

                loginBtn.disabled = false;

                loginBtn.innerHTML =
                    '<i class="fa-solid fa-right-to-bracket"></i> Sign In';

            }

        }
    );


    // ============================================================
    // AUTH STATE
    // ============================================================

    auth.onAuthStateChanged(
        async (user) => {

            if (!user) {

                loginPanel.classList.remove(
                    "hidden"
                );

                dashboard.classList.add(
                    "hidden"
                );

                userArea.classList.add(
                    "hidden"
                );

                return;
            }


            try {

                const userDoc =
                    await db
                        .collection("users")
                        .doc(user.uid)
                        .get();


                if (
                    !userDoc.exists ||
                    userDoc.data().role !== "admin"
                ) {

                    await auth.signOut();

                    loginError.textContent =
                        "Access denied. This account is not an admin.";

                    loginError.classList.remove(
                        "hidden"
                    );

                    return;
                }


                loginPanel.classList.add(
                    "hidden"
                );

                dashboard.classList.remove(
                    "hidden"
                );

                userArea.classList.remove(
                    "hidden"
                );

                userEmail.textContent =
                    user.email;

                avatar.textContent =
                    user.email
                        .charAt(0)
                        .toUpperCase();


                loadContent();

            } catch (error) {

                console.error(
                    "Authentication error:",
                    error
                );

            }

        }
    );


    // ============================================================
    // LOGOUT
    // ============================================================

    logoutBtn.addEventListener(
        "click",
        () => auth.signOut()
    );


    // ============================================================
    // PUBLISH CONTENT
    // ============================================================

    publishBtn.addEventListener(
        "click",
        publishContent
    );


    async function publishContent() {

        const title =
            titleInput.value.trim();

        const content =
            contentInput.value.trim();

        const price =
            Number(priceInput.value);


        if (!title) {

            showToast(
                "Enter a content title."
            );

            return;
        }


        if (!content) {

            showToast(
                "Enter the premium content."
            );

            return;
        }


        if (
            !Number.isFinite(price) ||
            price <= 0
        ) {

            showToast(
                "Enter a valid price."
            );

            return;
        }


        publishBtn.disabled = true;

        publishBtn.textContent =
            "Publishing...";


        try {

            await db
                .collection("content")
                .add({

                    title: title,

                    content: content,

                    price: price,

                    currency: "TZS",

                    createdBy:
                        auth.currentUser.email,

                    createdAt:
                        firebase.firestore.FieldValue
                            .serverTimestamp(),

                    active: true

                });


            titleInput.value = "";

            contentInput.value = "";

            priceInput.value = "";


            showToast(
                "Content published successfully!"
            );


        } catch (error) {

            console.error(
                "Publish error:",
                error
            );

            showToast(
                "Failed: " + error.message
            );

        } finally {

            publishBtn.disabled = false;

            publishBtn.innerHTML =
                '<i class="fa-solid fa-paper-plane"></i> Publish Content';

        }

    }


    // ============================================================
    // LOAD CONTENT
    // ============================================================

    function loadContent() {

        db.collection("content")
            .orderBy(
                "createdAt",
                "desc"
            )
            .onSnapshot(

                (snapshot) => {

                    if (snapshot.empty) {

                        contentList.innerHTML =
                            `
                            <div class="empty">
                                No content published yet.
                            </div>
                            `;

                        return;
                    }


                    let html = "";


                    snapshot.forEach(
                        (doc) => {

                            const data =
                                doc.data();


                            const createdAt =
                                data.createdAt
                                    ? data.createdAt
                                        .toDate()
                                        .toLocaleString()
                                    : "Just now";


                            const preview =
                                data.content
                                    .length > 150
                                    ? data.content.substring(
                                        0,
                                        150
                                    ) + "..."
                                    : data.content;


                            html += `

                                <div
                                    class="content-card"
                                >

                                    <div
                                        class="content-header"
                                    >

                                        <div
                                            class="content-title"
                                        >
                                            ${escapeHtml(
                                                data.title
                                            )}
                                        </div>

                                        <div
                                            class="price"
                                        >
                                            ${Number(
                                                data.price
                                            ).toLocaleString()}
                                            TZS
                                        </div>

                                    </div>


                                    <div
                                        class="content-preview"
                                    >
                                        ${escapeHtml(
                                            preview
                                        )}
                                    </div>


                                    <div
                                        class="content-footer"
                                    >

                                        <span
                                            class="date"
                                        >
                                            ${createdAt}
                                        </span>


                                        <button
                                            class="btn danger"
                                            onclick="deleteContent('${doc.id}')"
                                        >
                                            <i
                                                class="fa-solid fa-trash"
                                            ></i>
                                            Delete
                                        </button>

                                    </div>

                                </div>

                            `;

                        }
                    );


                    contentList.innerHTML =
                        html;

                },

                (error) => {

                    console.error(
                        "Load content error:",
                        error
                    );

                    contentList.innerHTML =
                        `
                        <div class="empty">
                            Error loading content:
                            ${escapeHtml(
                                error.message
                            )}
                        </div>
                        `;

                }

            );

    }


    // ============================================================
    // DELETE CONTENT
    // ============================================================

    window.deleteContent =
        async function(id) {

            const confirmed =
                confirm(
                    "Delete this premium content?"
                );


            if (!confirmed) return;


            try {

                await db
                    .collection("content")
                    .doc(id)
                    .delete();


                showToast(
                    "Content deleted."
                );

            } catch (error) {

                console.error(error);

                showToast(
                    "Delete failed: " +
                    error.message
                );

            }

        };


    // ============================================================
    // ESCAPE HTML
    // ============================================================

    function escapeHtml(value) {

        if (!value) return "";

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    // ============================================================
    // TOAST
    // ============================================================

    function showToast(message) {

        const old =
            document.querySelector(
                ".toast"
            );

        if (old) old.remove();


        const toast =
            document.createElement(
                "div"
            );

        toast.className =
            "toast";

        toast.textContent =
            message;


        document.body.appendChild(
            toast
        );


        setTimeout(
            () => toast.remove(),
            3500
        );

    }

</script>

</body>
</html>
