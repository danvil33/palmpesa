<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · BetLive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0e11;
            color: #eaecef;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            padding-top: 30px;
        }

        .app-container {
            width: 100%;
            max-width: 820px;
            background: #1e2329;
            border-radius: 24px;
            border: 1px solid #2b3139;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .app-header {
            padding: 18px 24px;
            background: #181a20;
            border-bottom: 1px solid #2b3139;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-brand .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #f0b90b, #f8d33a);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #181a20;
            font-weight: 700;
        }

        .app-brand h1 {
            font-size: 20px;
            font-weight: 700;
            color: #f0b90b;
        }

        .app-brand h1 span {
            color: #eaecef;
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2b3139;
            padding: 4px 14px 4px 8px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            color: #eaecef;
            cursor: default;
        }

        .user-profile .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f0b90b;
            color: #181a20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
        }

        .btn {
            border: none;
            padding: 7px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #2b3139;
            color: #eaecef;
        }

        .btn:hover {
            background: #3b424b;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #f0b90b;
            color: #181a20;
        }

        .btn-primary:hover {
            background: #f8d33a;
            box-shadow: 0 4px 16px rgba(240, 185, 11, 0.3);
        }

        .btn-danger {
            background: #f6465d;
            color: white;
        }

        .btn-danger:hover {
            background: #ff6b7f;
        }

        .btn-success {
            background: #0ecb81;
            color: white;
        }

        .btn-success:hover {
            background: #1ad991;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #2b3139;
            color: #eaecef;
        }

        .btn-outline:hover {
            background: #2b3139;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
        }

        .hidden {
            display: none !important;
        }

        .main-content {
            padding: 20px 24px 18px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: #181a20;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #848e9c;
            border: 1px solid #2b3139;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-dot.online {
            background: #0ecb81;
            box-shadow: 0 0 12px rgba(14, 203, 129, 0.4);
        }
        .status-dot.offline {
            background: #f6465d;
        }
        .status-dot.connecting {
            background: #f0b90b;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        .badge-count {
            background: #2b3139;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            color: #eaecef;
        }

        /* Auth Page */
        .auth-page {
            padding: 40px 30px;
            background: #181a20;
            border-radius: 16px;
            border: 1px solid #2b3139;
            margin-bottom: 12px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .auth-page .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-page .auth-header .lock-icon {
            font-size: 48px;
            color: #f0b90b;
            margin-bottom: 12px;
            display: block;
        }

        .auth-page .auth-header h3 {
            font-weight: 600;
            font-size: 22px;
            color: #eaecef;
            margin-bottom: 4px;
        }

        .auth-page .auth-header p {
            color: #848e9c;
            font-size: 14px;
        }

        .auth-page .form-group {
            margin-bottom: 16px;
        }

        .auth-page .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #848e9c;
            margin-bottom: 4px;
        }

        .auth-page .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #0b0e11;
            border: 1px solid #2b3139;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #eaecef;
            transition: border 0.2s;
            outline: none;
        }

        .auth-page .form-group input:focus {
            border-color: #f0b90b;
            box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.1);
        }

        .auth-page .role-badge {
            background: #2b3139;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            color: #eaecef;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            border: 1px solid #3b424b;
        }

        .auth-page .role-badge i {
            color: #f0b90b;
        }

        .auth-page .role-badge strong {
            color: #f0b90b;
        }

        .auth-page .btn {
            width: 100%;
            justify-content: center;
            padding: 10px;
            font-size: 14px;
        }

        .auth-page .auth-toggle {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: #848e9c;
        }

        .auth-page .auth-toggle a {
            color: #f0b90b;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-page .auth-toggle a:hover {
            text-decoration: underline;
        }

        .auth-page .auth-error {
            color: #f6465d;
            font-size: 13px;
            padding: 8px 12px;
            background: rgba(246, 70, 93, 0.1);
            border-radius: 8px;
            border-left: 3px solid #f6465d;
            margin-bottom: 12px;
        }

        .auth-page .auth-error.hidden {
            display: none;
        }

        /* Admin Panel */
        .admin-panel {
            background: #181a20;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2b3139;
        }

        .admin-panel .panel-title {
            font-weight: 600;
            font-size: 15px;
            color: #eaecef;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-panel .panel-title i {
            color: #f0b90b;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 160px;
            padding: 10px 16px;
            background: #0b0e11;
            border: 1px solid #2b3139;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #eaecef;
            transition: border 0.2s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #f0b90b;
            box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.1);
        }

        .input-group input::placeholder {
            color: #5e6673;
        }

        .payment-settings {
            background: #0b0e11;
            border-radius: 10px;
            padding: 14px;
            margin-top: 12px;
            border: 1px solid #2b3139;
        }

        .payment-settings .setting-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .payment-settings label {
            font-size: 13px;
            font-weight: 500;
            color: #848e9c;
            min-width: 120px;
        }

        .payment-settings input[type="number"] {
            width: 120px;
            padding: 8px 12px;
            background: #181a20;
            border: 1px solid #2b3139;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #eaecef;
            outline: none;
        }

        .payment-settings input[type="number"]:focus {
            border-color: #f0b90b;
            box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.1);
        }

        .payment-settings .currency {
            color: #f0b90b;
            font-weight: 600;
            font-size: 14px;
        }

        .flex {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .mt-3 {
            margin-top: 14px;
        }

        .message-list {
            margin-top: 14px;
            max-height: 300px;
            overflow-y: auto;
            background: #0b0e11;
            border-radius: 12px;
            border: 1px solid #2b3139;
        }

        .message-list::-webkit-scrollbar {
            width: 4px;
        }

        .message-list::-webkit-scrollbar-thumb {
            background: #2b3139;
            border-radius: 8px;
        }

        .message-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #2b3139;
            font-size: 13px;
            gap: 8px;
        }

        .message-item-admin:last-child {
            border-bottom: none;
        }

        .message-item-admin .msg-text {
            flex: 1;
            word-break: break-word;
            color: #eaecef;
        }

        .message-item-admin .msg-price {
            font-size: 11px;
            color: #0ecb81;
            font-weight: 600;
            background: rgba(14, 203, 129, 0.15);
            padding: 2px 10px;
            border-radius: 40px;
            white-space: nowrap;
        }

        .message-item-admin .msg-meta {
            font-size: 11px;
            color: #848e9c;
            white-space: nowrap;
            margin-right: 8px;
        }

        .message-item-admin .delete-btn {
            background: none;
            border: none;
            color: #f6465d;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
            font-size: 14px;
        }

        .message-item-admin .delete-btn:hover {
            background: rgba(246, 70, 93, 0.15);
        }

        .empty-msg {
            color: #848e9c;
            text-align: center;
            padding: 30px 0;
            font-size: 13px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2329;
            border: 1px solid #2b3139;
            color: #eaecef;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 2000;
            animation: toastUp 0.35s ease;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast i {
            font-size: 16px;
        }

        .toast.success i {
            color: #0ecb81;
        }
        .toast.error i {
            color: #f6465d;
        }
        .toast.info i {
            color: #f0b90b;
        }

        @keyframes toastUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 640px) {
            .app-header {
                padding: 14px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .header-actions {
                justify-content: space-between;
            }

            .main-content {
                padding: 14px 16px 14px;
            }

            .auth-page {
                padding: 28px 18px;
            }

            .input-group {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group input {
                width: 100%;
            }

            .payment-settings .setting-row {
                flex-direction: column;
                align-items: stretch;
            }

            .payment-settings input[type="number"] {
                width: 100%;
            }

            .message-item-admin {
                flex-wrap: wrap;
                gap: 4px;
            }

            .message-item-admin .msg-meta {
                white-space: normal;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <header class="app-header">
            <div class="app-brand">
                <div class="logo-icon">B</div>
                <h1>Bet<span>Live</span></h1>
            </div>
            <div class="header-actions">
                <div class="user-profile" id="userBadge">
                    <div class="avatar" id="userAvatar">G</div>
                    <span id="userNameDisplay">Guest</span>
                </div>
                <button class="btn btn-danger hidden" id="signOutBtn">
                    <i class="fa-regular fa-arrow-right-from-bracket"></i> Sign Out
                </button>
            </div>
        </header>

        <div class="main-content">
            <div class="status-bar">
                <div>
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Ready</span>
                </div>
                <div>
                    <span class="badge-count"><i class="fa-regular fa-message"></i> <span id="messageCount">0</span></span>
                </div>
            </div>

            <!-- Auth Page -->
            <div id="authPage" class="auth-page">
                <div class="auth-header">
                    <i class="fa-regular fa-lock lock-icon"></i>
                    <h3 id="authTitle">Admin Access</h3>
                    <p id="authSubtitle">Sign in to manage messages & payments</p>
                </div>

                <div class="auth-error hidden" id="authError"></div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="authEmail" placeholder="Enter your email" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" placeholder="Enter your password" />
                </div>

                <div class="role-badge">
                    <i class="fa-regular fa-shield"></i>
                    <span>You are registering as an <strong>Admin</strong></span>
                </div>

                <button class="btn btn-primary" id="authSubmitBtn">
                    <i class="fa-regular fa-arrow-right-to-bracket"></i> Sign In
                </button>

                <div class="auth-toggle">
                    <span id="authToggleText">Don't have an account?</span>
                    <a id="authToggleLink">Create one</a>
                </div>
            </div>

            <!-- Admin Content -->
            <div id="adminContent" class="hidden">
                <div class="admin-panel">
                    <div class="panel-title">
                        <i class="fa-regular fa-pen-to-square"></i> Write a Message
                    </div>
                    <div class="input-group">
                        <input type="text" id="adminMessageInput" placeholder="Type your message…" />
                        <button class="btn btn-success" id="publishBtn">
                            <i class="fa-regular fa-paper-plane"></i> Publish
                        </button>
                    </div>

                    <!-- Payment Settings -->
                    <div class="payment-settings">
                        <div class="setting-row">
                            <label><i class="fa-regular fa-coins"></i> Price per message:</label>
                            <input type="number" id="messagePriceInput" value="100" min="1" step="1" />
                            <span class="currency">TZS</span>
                            <span style="font-size:11px; color:#848e9c;">Bettors must pay this amount to view</span>
                        </div>
                    </div>

                    <div class="mt-3">
                        <div class="flex" style="justify-content:space-between;">
                            <span style="font-weight:500; font-size:13px; color:#eaecef;">
                                <i class="fa-regular fa-list"></i> All Messages
                            </span>
                            <button class="btn btn-danger btn-sm" id="clearAllBtn">
                                <i class="fa-regular fa-trash-can"></i> Clear All
                            </button>
                        </div>
                        <div id="messageListContainer" class="message-list">
                            <div class="empty-msg">No messages yet</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEjeRSyKbpEmbNk0SYLUFPp3lbgP9x3Ow",
            authDomain: "volcanobxpl.firebaseapp.com",
            projectId: "volcanobxpl",
            storageBucket: "volcanobxpl.firebasestorage.app",
            messagingSenderId: "742861205377",
            appId: "1:742861205377:web:bbe8a42b78c90354a64280",
            measurementId: "G-G1KWGHLZES"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let isSignUp = false;
        let unsubscribe = null;

        const $ = id => document.getElementById(id);
        const authPage = $('authPage');
        const authEmail = $('authEmail');
        const authPassword = $('authPassword');
        const authSubmitBtn = $('authSubmitBtn');
        const authToggleLink = $('authToggleLink');
        const authToggleText = $('authToggleText');
        const authTitle = $('authTitle');
        const authSubtitle = $('authSubtitle');
        const authError = $('authError');
        const adminContent = $('adminContent');
        const signOutBtn = $('signOutBtn');
        const userAvatar = $('userAvatar');
        const userNameDisplay = $('userNameDisplay');
        const adminInput = $('adminMessageInput');
        const publishBtn = $('publishBtn');
        const clearAllBtn = $('clearAllBtn');
        const messagePriceInput = $('messagePriceInput');
        const statusDot = $('statusDot');
        const statusText = $('statusText');
        const messageCountSpan = $('messageCount');
        const messageListContainer = $('messageListContainer');

        const messagesRef = db.collection('messages');

        // ============================================================
        // AUTH FUNCTIONS
        // ============================================================
        function toggleAuthMode(signUp = false) {
            isSignUp = signUp;
            authError.classList.add('hidden');
            authError.textContent = '';
            authEmail.value = '';
            authPassword.value = '';

            if (signUp) {
                authTitle.textContent = 'Create Admin Account';
                authSubtitle.textContent = 'Register as an administrator';
                authSubmitBtn.innerHTML = '<i class="fa-regular fa-user-plus"></i> Register as Admin';
                authToggleText.textContent = 'Already have an account?';
                authToggleLink.textContent = 'Sign In';
            } else {
                authTitle.textContent = 'Admin Sign In';
                authSubtitle.textContent = 'Sign in to manage messages & payments';
                authSubmitBtn.innerHTML = '<i class="fa-regular fa-arrow-right-to-bracket"></i> Sign In';
                authToggleText.textContent = "Don't have an account?";
                authToggleLink.textContent = 'Create one';
            }
            setTimeout(() => authEmail.focus(), 100);
        }

        function showAuthError(msg) {
            authError.textContent = msg;
            authError.classList.remove('hidden');
        }

        function handleAuthSubmit() {
            const email = authEmail.value.trim();
            const pass = authPassword.value.trim();

            if (!email || !pass) {
                showAuthError('Please fill in all fields');
                return;
            }
            if (pass.length < 6) {
                showAuthError('Password must be at least 6 characters');
                return;
            }

            authError.classList.add('hidden');
            authSubmitBtn.disabled = true;
            authSubmitBtn.innerHTML = '<i class="fa-regular fa-spinner fa-spin"></i> Processing…';

            if (isSignUp) {
                auth.createUserWithEmailAndPassword(email, pass)
                    .then((userCredential) => {
                        const user = userCredential.user;
                        return db.collection('users').doc(user.uid).set({
                            email: user.email,
                            role: 'admin',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(() => {
                            showToast('✅ Registered as Admin!', 'success');
                        });
                    })
                    .catch((err) => {
                        console.error("Signup error:", err);
                        showAuthError(err.message);
                        authSubmitBtn.disabled = false;
                        authSubmitBtn.innerHTML = isSignUp ?
                            '<i class="fa-regular fa-user-plus"></i> Register as Admin' :
                            '<i class="fa-regular fa-arrow-right-to-bracket"></i> Sign In';
                    });
            } else {
                auth.signInWithEmailAndPassword(email, pass)
                    .then(() => {
                        showToast('✅ Signed in successfully!', 'success');
                    })
                    .catch((err) => {
                        console.error("Login error:", err);
                        showAuthError(err.message);
                        authSubmitBtn.disabled = false;
                        authSubmitBtn.innerHTML = isSignUp ?
                            '<i class="fa-regular fa-user-plus"></i> Register as Admin' :
                            '<i class="fa-regular fa-arrow-right-to-bracket"></i> Sign In';
                    });
            }
        }

        function signOut() {
            auth.signOut().then(() => {
                showToast('👋 Signed out', 'info');
            });
        }

        // ============================================================
        // USER UI UPDATE
        // ============================================================
        function updateUI(user) {
            if (user) {
                currentUser = user;
                const displayName = user.email || 'Admin';
                const initial = displayName.charAt(0).toUpperCase();
                userAvatar.textContent = initial;
                userNameDisplay.textContent = displayName;
                signOutBtn.classList.remove('hidden');

                db.collection('users').doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const role = doc.data().role || 'bettor';
                        if (role === 'admin') {
                            authPage.classList.add('hidden');
                            adminContent.classList.remove('hidden');
                            startListening();
                        } else {
                            authPage.classList.remove('hidden');
                            adminContent.classList.add('hidden');
                            toggleAuthMode(false);
                            showAuthError('Access Denied: This account is not registered as an admin.');
                            if (unsubscribe) { unsubscribe();
                                unsubscribe = null; }
                            updateStatus('offline', 'Access Denied');
                            messageListContainer.innerHTML = `<div class="empty-msg">Access denied</div>`;
                        }
                    } else {
                        authPage.classList.remove('hidden');
                        adminContent.classList.add('hidden');
                        toggleAuthMode(false);
                        showAuthError('Access Denied: This account is not registered as an admin.');
                        if (unsubscribe) { unsubscribe();
                            unsubscribe = null; }
                        updateStatus('offline', 'Access Denied');
                        messageListContainer.innerHTML = `<div class="empty-msg">Access denied</div>`;
                    }
                });
            } else {
                currentUser = null;
                userAvatar.textContent = 'G';
                userNameDisplay.textContent = 'Guest';
                signOutBtn.classList.add('hidden');
                authPage.classList.remove('hidden');
                adminContent.classList.add('hidden');
                toggleAuthMode(false);
                if (unsubscribe) { unsubscribe();
                    unsubscribe = null; }
                messageCountSpan.textContent = '0';
                updateStatus('offline', 'Not signed in');
                messageListContainer.innerHTML = `<div class="empty-msg">Sign in to manage messages</div>`;
            }
        }

        // ============================================================
        // STATUS HELPER
        // ============================================================
        function updateStatus(state, text) {
            statusDot.className = 'status-dot';
            if (state === 'online') {
                statusDot.classList.add('online');
                statusText.textContent = text || 'Live';
            } else if (state === 'offline') {
                statusDot.classList.add('offline');
                statusText.textContent = text || 'Offline';
            } else {
                statusDot.classList.add('connecting');
                statusText.textContent = text || 'Connecting…';
            }
        }

        // ============================================================
        // FIRESTORE LISTENER
        // ============================================================
        function startListening() {
            if (unsubscribe) unsubscribe();
            updateStatus('connecting', 'Connecting…');

            unsubscribe = messagesRef.orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
                updateStatus('online', 'Live');
                messageCountSpan.textContent = snapshot.size;

                if (snapshot.empty) {
                    messageListContainer.innerHTML = `<div class="empty-msg">No messages yet</div>`;
                    return;
                }

                let html = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const text = data.text || '⚠️ empty message';
                    const price = data.price || 0;
                    const time = data.timestamp ? new Date(data.timestamp.seconds * 1000) : new Date();
                    const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dateStr = time.toLocaleDateString([], { month: 'short', day: 'numeric' });
                    const docId = doc.id;

                    html += `
                        <div class="message-item-admin">
                            <span class="msg-text">${escapeHtml(text)}</span>
                            <span class="msg-price">${price > 0 ? 'TZS ' + price : 'FREE'}</span>
                            <span class="msg-meta">${dateStr} ${timeStr}</span>
                            <button class="delete-btn" data-id="${docId}" title="Delete message">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                });
                messageListContainer.innerHTML = html;

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        deleteMessage(id);
                    });
                });

            }, (error) => {
                console.error('Firestore listener error:', error);
                updateStatus('offline', 'Connection error');
                messageListContainer.innerHTML = `
                    <div class="empty-msg" style="color:#f6465d;">
                        <i class="fa-regular fa-triangle-exclamation"></i> Connection error
                    </div>
                `;
            });
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g,
                "&#039;");
        }

        // ============================================================
        // ADMIN ACTIONS
        // ============================================================
        async function publishMessage() {
            const text = adminInput.value.trim();
            const price = parseInt(messagePriceInput.value) || 0;

            if (!text) { showToast('✏️ Please write a message', 'info'); return; }
            if (price < 0) { showToast('⚠️ Price cannot be negative', 'error'); return; }

            publishBtn.disabled = true;
            publishBtn.innerHTML = '<i class="fa-regular fa-spinner fa-spin"></i> Sending…';

            try {
                await messagesRef.add({
                    text: text,
                    price: price,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    from: currentUser?.email || 'admin'
                });
                adminInput.value = '';
                showToast(`✅ Message published! Price: ${price > 0 ? 'TZS ' + price : 'FREE'}`, 'success');
            } catch (err) {
                console.error('Publish error:', err);
                showToast('❌ Error: ' + err.message, 'error');
            } finally {
                publishBtn.disabled = false;
                publishBtn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> Publish';
            }
        }

        async function deleteMessage(docId) {
            if (!confirm('Delete this message?')) return;
            try {
                await messagesRef.doc(docId).delete();
                showToast('🗑️ Message deleted', 'success');
            } catch (err) {
                console.error('Delete error:', err);
                showToast('❌ Error: ' + err.message, 'error');
            }
        }

        async function clearAllMessages() {
            if (!confirm('Delete ALL messages from Firestore?')) return;
            try {
                const snapshot = await messagesRef.get();
                if (snapshot.empty) { showToast('📭 No messages to clear', 'info'); return; }
                const batch = db.batch();
                snapshot.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
                showToast('🗑️ All messages deleted', 'success');
            } catch (err) {
                console.error('Clear error:', err);
                showToast('❌ Error: ' + err.message, 'error');
            }
        }

        function showToast(msg, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const icons = {
                success: 'fa-regular fa-circle-check',
                error: 'fa-regular fa-circle-xmark',
                info: 'fa-regular fa-circle-info'
            };

            const div = document.createElement('div');
            div.className = `toast ${type}`;
            div.innerHTML = `<i class="${icons[type] || icons.info}"></i> ${msg}`;
            document.body.appendChild(div);

            setTimeout(() => {
                if (div.parentNode) div.remove();
            }, 3500);
        }

        // ============================================================
        // AUTH STATE OBSERVER
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('👤 User logged in:', user.email);
                updateUI(user);
            } else {
                console.log('👤 No user');
                updateUI(null);
            }
        });

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        authSubmitBtn.addEventListener('click', handleAuthSubmit);
        authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuthSubmit(); });
        authEmail.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuthSubmit(); });

        authToggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleAuthMode(!isSignUp);
        });

        signOutBtn.addEventListener('click', signOut);
        publishBtn.addEventListener('click', publishMessage);
        adminInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') publishMessage(); });
        clearAllBtn.addEventListener('click', clearAllMessages);

        // ============================================================
        // INIT
        // ============================================================
        toggleAuthMode(false);
        updateStatus('connecting', 'Initializing…');
        console.log('🚀 Admin panel ready with payment settings');
        console.log('📌 Admins can set prices per message');
    </script>
</body>
</html>
