<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BetLive · Premium Content</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e11;
            color: #eaecef;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        /* HEADER */

        header {
            background: #181a20;
            border: 1px solid #2b3139;
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f0b90b, #f8d33a);
            color: #181a20;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }

        .brand h1 {
            color: #f0b90b;
            font-size: 20px;
        }

        .brand span {
            color: #eaecef;
            font-weight: 400;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-email {
            font-size: 12px;
            color: #848e9c;
        }

        .logout-btn {
            background: #f6465d;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* AUTH */

        .auth-box {
            max-width: 420px;
            margin: 60px auto;
            background: #181a20;
            border: 1px solid #2b3139;
            border-radius: 18px;
            padding: 30px;
        }

        .auth-box h2 {
            margin-bottom: 7px;
        }

        .auth-box > p {
            color: #848e9c;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            color: #848e9c;
            font-size: 12px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #0b0e11;
            color: #eaecef;
            border: 1px solid #2b3139;
            border-radius: 9px;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: #f0b90b;
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            background: #f0b90b;
            color: #181a20;
            border: none;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-btn:hover {
            background: #f8d33a;
        }

        .switch-auth {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #848e9c;
        }

        .switch-auth span {
            color: #f0b90b;
            font-weight: 600;
            cursor: pointer;
        }

        /* MAIN */

        .page-heading {
            margin-bottom: 20px;
        }

        .page-heading h2 {
            font-size: 23px;
        }

        .page-heading p {
            color: #848e9c;
            font-size: 13px;
            margin-top: 5px;
        }

        /* CONTENT */

        .content-list {
            display: grid;
            gap: 16px;
        }

        .content-card {
            background: #181a20;
            border: 1px solid #2b3139;
            border-radius: 16px;
            padding: 20px;
        }

        .content-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 12px;
        }

        .content-title {
            font-size: 18px;
            font-weight: 700;
        }

        .price {
            color: #f0b90b;
            background: rgba(240,185,11,.12);
            border: 1px solid rgba(240,185,11,.2);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .description {
            color: #aeb4bd;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        /* LOCKED */

        .locked-box {
            background: #0b0e11;
            border: 1px solid #2b3139;
            border-radius: 12px;
            padding: 22px;
            text-align: center;
        }

        .lock-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .locked-box h3 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .locked-box p {
            color: #848e9c;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .pay-btn {
            background: #0ecb81;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: #1ad991;
        }

        /* UNLOCKED */

        .unlocked-box {
            background: #0b0e11;
            border: 1px solid #0ecb81;
            border-radius: 12px;
            padding: 18px;
        }

        .unlocked-label {
            color: #0ecb81;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .premium-content {
            white-space: pre-wrap;
            color: #eaecef;
            font-size: 14px;
            line-height: 1.7;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            padding: 60px 20px;
            background: #181a20;
            border: 1px solid #2b3139;
            border-radius: 16px;
            color: #848e9c;
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.78);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-box {
            width: 100%;
            max-width: 420px;
            background: #181a20;
            border: 1px solid #2b3139;
            border-radius: 18px;
            padding: 25px;
        }

        .modal-box h3 {
            margin-bottom: 6px;
        }

        .modal-box .modal-description {
            color: #848e9c;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .payment-amount {
            background: #0b0e11;
            border: 1px solid #2b3139;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .payment-amount span:last-child {
            color: #f0b90b;
            font-weight: 700;
        }

        .cancel-btn {
            width: 100%;
            margin-top: 8px;
            padding: 11px;
            background: #2b3139;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
        }

        /* MESSAGE */

        .message {
            display: none;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .message.error {
            display: block;
            background: rgba(246,70,93,.1);
            border: 1px solid rgba(246,70,93,.25);
            color: #f6465d;
        }

        .message.success {
            display: block;
            background: rgba(14,203,129,.1);
            border: 1px solid rgba(14,203,129,.25);
            color: #0ecb81;
        }

        .message.info {
            display: block;
            background: rgba(240,185,11,.1);
            border: 1px solid rgba(240,185,11,.25);
            color: #f0b90b;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #848e9c;
        }

        /* MOBILE */

        @media(max-width:600px) {

            body {
                padding: 10px;
            }

            header {
                flex-direction: column;
                align-items: stretch;
            }

            .user-area {
                justify-content: space-between;
            }

            .content-top {
                flex-direction: column;
            }

            .price {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header id="mainHeader" class="hidden">

        <div class="brand">
            <div class="logo">B</div>

            <h1>
                Bet<span>Live</span>
            </h1>
        </div>

        <div class="user-area">

            <div
                class="user-email"
                id="userEmail"
            ></div>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Sign Out
            </button>

        </div>

    </header>


    <!-- AUTH -->

    <section
        id="authSection"
        class="auth-box"
    >

        <h2 id="authTitle">
            Bettor Login
        </h2>

        <p id="authSubtitle">
            Sign in to access premium content.
        </p>

        <div
            id="authMessage"
            class="message"
        ></div>

        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

        </div>

        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

        </div>

        <button
            class="primary-btn"
            id="authButton"
            onclick="handleAuth()"
        >
            Sign In
        </button>

        <div class="switch-auth">

            <span id="switchText">
                Don't have an account?
            </span>

            <span
                id="switchButton"
                onclick="toggleAuthMode()"
            >
                Create account
            </span>

        </div>

    </section>


    <!-- CONTENT -->

    <main
        id="contentSection"
        class="hidden"
    >

        <div class="page-heading">

            <h2>
                Premium Content
            </h2>

            <p>
                Purchase access to premium posts.
            </p>

        </div>

        <div
            id="contentList"
            class="content-list"
        >

            <div class="loading">
                Loading content...
            </div>

        </div>

    </main>

</div>


<!-- PAYMENT MODAL -->

<div
    id="paymentModal"
    class="modal hidden"
>

    <div class="modal-box">

        <h3>
            Unlock Premium Content
        </h3>

        <p
            class="modal-description"
            id="paymentContentTitle"
        ></p>

        <div class="payment-amount">

            <span>
                Amount
            </span>

            <span id="paymentAmount">
                0 TZS
            </span>

        </div>

        <div
            id="paymentMessage"
            class="message"
        ></div>

        <input
            type="tel"
            id="paymentPhone"
            placeholder="07XXXXXXXX or 2557XXXXXXXX"
        >

        <button
            class="primary-btn"
            id="paymentButton"
            onclick="startPayment()"
        >
            Pay Now
        </button>

        <button
            class="cancel-btn"
            onclick="closePaymentModal()"
        >
            Cancel
        </button>

    </div>

</div>


<script>

    // ============================================================
    // FIREBASE
    // ============================================================

    const firebaseConfig = {

        apiKey: "AIzaSyBEjeRSyKbpEmbNk0SYLUFPp3lbgP9x3Ow",

        authDomain: "volcanobxpl.firebaseapp.com",

        projectId: "volcanobxpl",

        storageBucket: "volcanobxpl.firebasestorage.app",

        messagingSenderId: "742861205377",

        appId: "1:742861205377:web:bbe8a42b78c90354a64280",

        measurementId: "G-G1KWGHLZES"

    };


    firebase.initializeApp(firebaseConfig);


    const auth = firebase.auth();

    const db = firebase.firestore();


    // ============================================================
    // STATE
    // ============================================================

    let currentUser = null;

    let isSignUp = false;

    let selectedContent = null;

    let unsubscribeContent = null;


    // ============================================================
    // DOM
    // ============================================================

    const authSection =
        document.getElementById("authSection");

    const contentSection =
        document.getElementById("contentSection");

    const mainHeader =
        document.getElementById("mainHeader");

    const contentList =
        document.getElementById("contentList");

    const authMessage =
        document.getElementById("authMessage");

    const paymentModal =
        document.getElementById("paymentModal");

    const paymentMessage =
        document.getElementById("paymentMessage");


    // ============================================================
    // AUTH MODE
    // ============================================================

    function toggleAuthMode() {

        isSignUp = !isSignUp;

        clearMessage(authMessage);

        document.getElementById("email").value = "";

        document.getElementById("password").value = "";


        if (isSignUp) {

            document.getElementById("authTitle").textContent =
                "Create Bettor Account";

            document.getElementById("authSubtitle").textContent =
                "Create an account to access premium content.";

            document.getElementById("authButton").textContent =
                "Create Account";

            document.getElementById("switchText").textContent =
                "Already have an account?";

            document.getElementById("switchButton").textContent =
                "Sign In";

        } else {

            document.getElementById("authTitle").textContent =
                "Bettor Login";

            document.getElementById("authSubtitle").textContent =
                "Sign in to access premium content.";

            document.getElementById("authButton").textContent =
                "Sign In";

            document.getElementById("switchText").textContent =
                "Don't have an account?";

            document.getElementById("switchButton").textContent =
                "Create account";

        }

    }


    // ============================================================
    // AUTH
    // ============================================================

    async function handleAuth() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value.trim();


        if (!email || !password) {

            showMessage(
                authMessage,
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                authMessage,
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        const button =
            document.getElementById("authButton");


        button.disabled = true;

        button.textContent =
            "Please wait...";


        try {

            if (isSignUp) {

                const result =
                    await auth.createUserWithEmailAndPassword(
                        email,
                        password
                    );


                await db
                    .collection("users")
                    .doc(result.user.uid)
                    .set({

                        email: email,

                        role: "bettor",

                        createdAt:
                            firebase.firestore.FieldValue.serverTimestamp()

                    });


                showMessage(
                    authMessage,
                    "Account created successfully.",
                    "success"
                );

            } else {

                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );

            }

        } catch (error) {

            console.error(error);

            showMessage(
                authMessage,
                friendlyAuthError(error),
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                isSignUp
                    ? "Create Account"
                    : "Sign In";

        }

    }


    function friendlyAuthError(error) {

        if (
            error.code ===
            "auth/email-already-in-use"
        ) {
            return "That email is already registered.";
        }

        if (
            error.code ===
            "auth/invalid-email"
        ) {
            return "Please enter a valid email.";
        }

        if (
            error.code ===
            "auth/wrong-password"
        ) {
            return "Incorrect email or password.";
        }

        if (
            error.code ===
            "auth/user-not-found"
        ) {
            return "No account was found with this email.";
        }

        return error.message || "Authentication failed.";

    }


    // ============================================================
    // LOGOUT
    // ============================================================

    async function logout() {

        try {

            await auth.signOut();

        } catch (error) {

            console.error(error);

        }

    }


    // ============================================================
    // AUTH STATE
    // ============================================================

    auth.onAuthStateChanged(async user => {

        if (!user) {

            currentUser = null;

            authSection.classList.remove("hidden");

            contentSection.classList.add("hidden");

            mainHeader.classList.add("hidden");

            return;

        }


        currentUser = user;


        document.getElementById("userEmail").textContent =
            user.email;


        authSection.classList.add("hidden");

        mainHeader.classList.remove("hidden");

        contentSection.classList.remove("hidden");


        await ensureUserDocument();

        loadContent();

    });


    // ============================================================
    // ENSURE USER DOCUMENT
    // ============================================================

    async function ensureUserDocument() {

        const ref =
            db.collection("users")
                .doc(currentUser.uid);


        const snapshot =
            await ref.get();


        if (!snapshot.exists) {

            await ref.set({

                email: currentUser.email,

                role: "bettor",

                createdAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });

        }

    }


    // ============================================================
    // LOAD CONTENT
    // ============================================================

    function loadContent() {

        if (unsubscribeContent) {

            unsubscribeContent();

        }


        unsubscribeContent =
            db.collection("content")
                .orderBy(
                    "createdAt",
                    "desc"
                )
                .onSnapshot(

                    snapshot => {

                        if (snapshot.empty) {

                            contentList.innerHTML = `
                                <div class="empty">
                                    <h3>No premium content yet</h3>
                                    <p>
                                        Check back later for new posts.
                                    </p>
                                </div>
                            `;

                            return;

                        }


                        let html = "";


                        snapshot.forEach(doc => {

                            const data = doc.data();

                            html +=
                                createContentCard(
                                    doc.id,
                                    data
                                );

                        });


                        contentList.innerHTML = html;

                    },

                    error => {

                        console.error(
                            "Content listener error:",
                            error
                        );

                        contentList.innerHTML = `
                            <div class="empty">
                                Unable to load content.
                            </div>
                        `;

                    }

                );

    }


    // ============================================================
    // CONTENT CARD
    // ============================================================

    function createContentCard(id, data) {

        const title =
            escapeHtml(
                data.title || "Premium Content"
            );


        const description =
            escapeHtml(
                data.description || ""
            );


        const amount =
            Number(data.price || 0);


        const content =
            escapeHtml(
                data.content || ""
            );


        const isFree =
            amount <= 0;


        if (isFree) {

            return `

                <div class="content-card">

                    <div class="content-top">

                        <div class="content-title">
                            ${title}
                        </div>

                        <div class="price">
                            FREE
                        </div>

                    </div>

                    <div class="description">
                        ${description}
                    </div>

                    <div class="unlocked-box">

                        <div class="unlocked-label">
                            ✓ AVAILABLE
                        </div>

                        <div class="premium-content">
                            ${content}
                        </div>

                    </div>

                </div>

            `;

        }


        return `

            <div class="content-card">

                <div class="content-top">

                    <div class="content-title">
                        ${title}
                    </div>

                    <div class="price">
                        ${formatMoney(amount)} TZS
                    </div>

                </div>

                <div class="description">
                    ${description}
                </div>

                <div class="locked-box">

                    <div class="lock-icon">
                        🔒
                    </div>

                    <h3>
                        Premium Content
                    </h3>

                    <p>
                        Pay ${formatMoney(amount)} TZS
                        to unlock this content.
                    </p>

                    <button
                        class="pay-btn"
                        onclick="openPaymentModal(
                            '${id}',
                            ${amount},
                            '${escapeAttribute(title)}'
                        )"
                    >
                        Pay ${formatMoney(amount)} TZS
                    </button>

                </div>

            </div>

        `;

    }


    // ============================================================
    // PAYMENT MODAL
    // ============================================================

    function openPaymentModal(
        contentId,
        amount,
        title
    ) {

        selectedContent = {

            id: contentId,

            amount: amount,

            title: title

        };


        document.getElementById(
            "paymentContentTitle"
        ).textContent = title;


        document.getElementById(
            "paymentAmount"
        ).textContent =
            formatMoney(amount) + " TZS";


        document.getElementById(
            "paymentPhone"
        ).value = "";


        clearMessage(paymentMessage);


        paymentModal.classList.remove("hidden");

    }


    function closePaymentModal() {

        paymentModal.classList.add("hidden");

        selectedContent = null;

    }


    // ============================================================
    // START PAYMENT
    // ============================================================

    async function startPayment() {

        if (!currentUser) {

            showMessage(
                paymentMessage,
                "Please sign in first.",
                "error"
            );

            return;

        }


        if (!selectedContent) {

            showMessage(
                paymentMessage,
                "No content selected.",
                "error"
            );

            return;

        }


        const phone =
            document.getElementById(
                "paymentPhone"
            ).value.trim();


        if (!phone) {

            showMessage(
                paymentMessage,
                "Enter your Tanzanian phone number.",
                "error"
            );

            return;

        }


        const button =
            document.getElementById(
                "paymentButton"
            );


        button.disabled = true;

        button.textContent =
            "Sending payment request...";


        clearMessage(paymentMessage);


        try {

            const response =
                await fetch(
                    "/api/payment",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            name:
                                currentUser.email,

                            email:
                                currentUser.email,

                            phone:
                                phone,

                            amount:
                                selectedContent.amount,

                            contentId:
                                selectedContent.id

                        })

                    }
                );


            const result =
                await response.json();


            console.log(
                "Payment response:",
                result
            );


            if (!response.ok || !result.success) {

                throw new Error(
                    result.message ||
                    "Payment request failed."
                );

            }


            showMessage(
                paymentMessage,
                "Payment request sent. Check your phone and approve the payment.",
                "success"
            );


            button.textContent =
                "Payment Sent";


        } catch (error) {

            console.error(
                "Payment error:",
                error
            );


            showMessage(
                paymentMessage,
                error.message ||
                "Unable to start payment.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "Pay Now";

        }

    }


    // ============================================================
    // HELPERS
    // ============================================================

    function formatMoney(number) {

        return Number(number)
            .toLocaleString("en-TZ");

    }


    function showMessage(
        element,
        text,
        type
    ) {

        element.textContent = text;

        element.className =
            "message " + type;

    }


    function clearMessage(element) {

        element.textContent = "";

        element.className =
            "message";

    }


    function escapeHtml(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function escapeAttribute(value) {

        return String(value || "")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/\n/g, "\\n")
            .replace(/\r/g, "");

    }


    // ============================================================
    // ENTER KEY
    // ============================================================

    document
        .getElementById("password")
        .addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    handleAuth();

                }

            }
        );
