<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PalmPesa Payment</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }

    h2 {
      text-align: center;
      color: #087a4b;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 7px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #087a4b;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .success {
      display: block !important;
      background: #e8f7ee;
      color: #087a4b;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: #b42318;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>PalmPesa Payment</h2>

  <form id="paymentForm">

    <input
      id="name"
      placeholder="Full name"
      required
    >

    <input
      id="email"
      type="email"
      placeholder="Email"
      required
    >

    <input
      id="phone"
      placeholder="Phone number"
      required
    >

    <input
      id="amount"
      type="number"
      value="200"
      min="1"
      placeholder="Amount"
      required
    >

    <button id="payButton">
      Pay Now
    </button>

  </form>

  <div id="status"></div>

</div>


<script>

const form =
  document.getElementById("paymentForm");

const button =
  document.getElementById("payButton");

const status =
  document.getElementById("status");


form.addEventListener("submit", async (e) => {

  e.preventDefault();

  button.disabled = true;
  button.textContent = "Processing...";

  status.className = "";
  status.textContent = "Sending payment request...";
  status.style.display = "block";


  const payment = {

    name:
      document.getElementById("name").value,

    email:
      document.getElementById("email").value,

    phone:
      document.getElementById("phone").value,

    amount:
      Number(
        document.getElementById("amount").value
      )

  };


  try {

    const response = await fetch(
      "/api/payment",
      {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body:
          JSON.stringify(payment)

      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Payment failed"
      );

    }


    status.className = "success";

    status.textContent =
      data.message ||
      "Payment initiated. Check your phone.";


    console.log(
      "PalmPesa response:",
      data
    );


  } catch (error) {

    status.className = "error";

    status.textContent =
      error.message;

    console.error(error);

  }


  button.disabled = false;

  button.textContent = "Pay Now";

});

</script>

</body>
</html>
